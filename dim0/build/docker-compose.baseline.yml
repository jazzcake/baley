# Provider-free WP0 overlay. Use only with the upstream `test` profile and an
# external non-secret environment/evidence roots documented in task-189-baseline-execution.md.
services:
  qdrant-test:
    container_name: dim0-task189-qdrant
    ports: !reset []
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; grep -q 'all shards are ready' <&3"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s

  postgres-test:
    container_name: dim0-task189-postgres
    ports: !reset []

  redis-test:
    container_name: dim0-task189-redis
    ports: !reset []

  backend-test:
    container_name: dim0-task189-backend
    depends_on:
      postgres-test:
        condition: service_healthy
      qdrant-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    volumes:
      # Long syntax accepts an absolute Windows path on another drive. Because
      # Compose merges service volumes by container target, this replaces the
      # base file's ../${ENVFILE} entry for /.env.
      - type: bind
        source: ${BASELINE_ENV_FILE:?set BASELINE_ENV_FILE to the absolute non-secret env file}
        target: /.env
        read_only: true
      - type: bind
        source: ${BASELINE_RUN_DIR:?set BASELINE_RUN_DIR to the unique evidence directory}
        target: /baseline-evidence
      - backend_data_test:/app/data
    environment:
      DIM0_BASELINE_PROVIDER_TRIPWIRE: "1"
      DIM0_BASELINE_FAKE_EMBEDDING_DIMENSION: "512"
      DIM0_BASELINE_TRIPWIRE_OUTPUT: /baseline-evidence/provider-invocations.json
      DIM0_BASELINE_CONSTRUCTION_OUTPUT: /baseline-evidence/provider-constructions.json
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      OPENAI_AGENTS_DISABLE_TRACING: "1"
      OPENAI_AGENTS_DONT_LOG_MODEL_DATA: "1"
      OPENAI_AGENTS_DONT_LOG_TOOL_DATA: "1"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENROUTER_API_KEY: ""
      MISTRAL_API_KEY: ""
      PERPLEXITY_API_KEY: ""
      TAVILY_API_KEY: ""
      LINKUP_API_KEY: ""
      EXA_API_KEY: ""
      DAYTONA_API_KEY: ""
    command: ["python", "-m", "test.integration.baseline.provider_tripwire"]
    ports: !reset []

  webui-test:
    container_name: dim0-task189-webui
    environment:
      DIM0_BASELINE_PROVIDER_TRIPWIRE: "1"
      # The disposable browser observer shares this internal Compose network,
      # so its browser can reach the real backend without using a host gateway.
      API_ORIGIN: http://backend-test:8082
    # Windows Git checkouts may present this script with CRLF. Normalize only
    # the disposable container copy before execution; product sources and the
    # host checkout remain untouched.
    command: ["/bin/sh", "-c", "node /app/scripts/task189-localize-dotlottie.mjs && sed -i 's/\\r$//' /docker-entrypoint.sh && exec /docker-entrypoint.sh"]
    ports: !reset []

networks:
  default:
    # Mandatory provider-free application and browser checks can reach only
    # the five baseline services. No baseline service publishes a host port;
    # readiness and acceptance probes execute inside this network.
    internal: true
