version: "3.8"

services:
  postgres:
    image: postgres:17.5-alpine
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=password
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    secrets:
      - postgres_admin_password
    volumes:
      - devhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-512m}
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE}

volumes:
  devhub_postgres_data:
    name: devhub-postgres-data
