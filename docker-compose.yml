services:
  api:
    image: baley-api:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.server
      args:
        BALEY_BUILD_VERSION: ${BALEY_BUILD_VERSION:-dev}
        BALEY_BUILD_COMMIT: ${BALEY_BUILD_COMMIT:-unknown}
        BALEY_BUILD_TIME: ${BALEY_BUILD_TIME:-unknown}
    restart: unless-stopped
    environment:
      # The Pilot is reached through its Tailscale HTTPS endpoint. Keep the
      # authentication runtime in production mode so auth and OIDC binding
      # cookies cannot be sent over HTTP.
      BALEY_ENV: production
      # Use the shared container's unique name rather than a generic network alias.
      BALEY_DATABASE_URL: postgres://baley_app:${BALEY_DB_PASSWORD}@local-dev-postgres:5432/baley?sslmode=disable
      BALEY_VIEWER_ORIGINS: https://jazzcake-home.tail87e929.ts.net
      BALEY_MCP_LOGIN_ORIGIN: https://jazzcake-home.tail87e929.ts.net
      BALEY_MCP_LOOPBACK_CALLBACK_ORIGIN: http://127.0.0.1:8090
      BALEY_COOKIE_SECURE: "true"
      # Long-lived browser login remains server-revocable. Idle activity may
      # extend only up to the absolute deadline; explicit logout and account,
      # membership, Workspace, or credential revocation still win immediately.
      BALEY_SESSION_IDLE_TTL: ${BALEY_SESSION_IDLE_TTL:-720h}
      BALEY_SESSION_ABSOLUTE_TTL: ${BALEY_SESSION_ABSOLUTE_TTL:-2160h}
      # OAuth client ID is public configuration. The client secret is mounted
      # read-only from the ignored local secret path; it is never a Compose
      # literal, source-controlled value, or Codex Authorization header.
      # Keep every optional provider input operator-supplied so a deployment
      # without the ignored secret mount starts with OIDC disabled as a unit.
      BALEY_GOOGLE_OIDC_CLIENT_ID: ${BALEY_GOOGLE_OIDC_CLIENT_ID:-}
      BALEY_GOOGLE_OIDC_CLIENT_SECRET_FILE: ${BALEY_GOOGLE_OIDC_CLIENT_SECRET_FILE:-/run/secrets/baley_google_oidc_client_secret}
      BALEY_GOOGLE_OIDC_REDIRECT_URL: ${BALEY_GOOGLE_OIDC_REDIRECT_URL:-}
      BALEY_OIDC_POST_LOGIN_URL: ${BALEY_OIDC_POST_LOGIN_URL:-}
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - default
      - local-dev
    volumes:
      - baley-server-state:/var/lib/baley
    secrets:
      - baley_google_oidc_client_secret
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  viewer:
    image: baley-viewer:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.viewer
      args:
        VITE_BALEY_API_URL: /api
        VITE_BALEY_AUTH_MODE: enforced
        BALEY_BUILD_COMMIT: ${BALEY_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5174/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  baley-server-state:

secrets:
  baley_google_oidc_client_secret:
    file: ${BALEY_SECRET_ROOT:-C:/ProgramData/Baley/secrets}/google_oidc_client_secret
networks:
  local-dev:
    external: true
    name: local-dev
