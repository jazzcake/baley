services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: baley
      POSTGRES_USER: baley
      POSTGRES_PASSWORD: baley
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baley -d baley"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - baley-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    environment:
      BALEY_DATABASE_URL: postgres://baley:baley@postgres:5432/baley?sslmode=disable
      BALEY_VIEWER_ORIGINS: http://127.0.0.1:5174,http://jazzcake-home.tail87e929.ts.net,https://jazzcake-home.tail87e929.ts.net
      BALEY_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - baley-server-state:/var/lib/baley
      # Preserves the existing local-Pilot lease signing secret on first
      # container startup. The API copies it into its named volume once.
      - ./.tmp/local-pilot/secrets:/legacy-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

  viewer:
    build:
      context: .
      dockerfile: docker/Dockerfile.viewer
      args:
        VITE_BALEY_API_URL: /api
        VITE_BALEY_AUTH_MODE: enforced
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      api:
        condition: service_healthy

volumes:
  baley-postgres:
  baley-server-state:
