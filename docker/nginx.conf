resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 5174;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Always revalidate the SPA entry point. Vite fingerprints assets, so this
  # prevents an open Viewer session from retaining a previous app shell while
  # allowing the immutable bundles themselves to remain cacheable.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The Tailscale-served Viewer uses this same-origin route, so remote browsers
  # never attempt to call their own loopback API address.
  location /api/ {
    # Resolve Docker's `api` service for each request. nginx otherwise keeps the
    # IP from its own startup and returns 502 after the API container is recreated.
    # Strip this Viewer-only `/api/` prefix before forwarding to the API service.
    set $baley_api http://api:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $baley_api$uri$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

}
